[package]
name = "nblast"
description = "Implementation of NBLAST neurite similarity algorithm"
version = "0.7.1"
repository = "https://github.com/clbarnes/nblast-rs/tree/master/nblast-rs"
homepage = "https://github.com/clbarnes/nblast-rs"
documentation = "https://docs.rs/nblast"
authors = ["Chris L. Barnes <chrislloydbarnes@gmail.com>"]
edition = "2021"
license = "GPL-3.0"
readme = "README.md"
keywords = ["neuroscience", "morphology", "nblast"]
categories = ["algorithms", "science"]
rust-version = "1.75"

[badges]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

nalgebra = "0.31"
fastrand = "1.9"
thiserror = "1.0"
cfg-if = "1.0.0"
rayon = { version = "1.5", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

# neuron implementations

rstar = { version = "0.13", optional = true }
nabo = { version = "0.6", optional = true }
kiddo = { version = "4.2.1", optional = true }
bosque = { version = "0.2.0", optional = true }
shull = { version = "0.3.0", optional = true }
aann = { version = "0.1.0", optional = true }

[dev-dependencies]

bencher = "0.1.5"
csv = "1.1"
fastrand = "1.9"
serde = { version = "1", features = ["derive"] }

[features]
default = ["kiddo"]

parallel = ["rayon"]
serde = ["dep:serde", "kiddo?/serialize", "rstar?/serde"]
aann = ["dep:aann", "dep:shull"]

[[bench]]

name = "bench"
harness = false
required-features = ["parallel", "bosque", "kiddo", "nabo", "rstar"]

[package.metadata.release]
publish = false
tag-prefix = "rs-"
